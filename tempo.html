<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#2F6FB5" />
<title>Previsão do tempo</title>
<!-- Ícone próprio: a aba não mostra o ícone do SOMA -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='%23F5B82E'/%3E%3Cg stroke='%23F5B82E' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M32 4v8M32 52v8M4 32h8M52 32h8M12 12l6 6M46 46l6 6M12 52l6-6M46 18l6-6'/%3E%3C/g%3E%3C/svg%3E" />
<!--
  Página "máscara" da saída rápida do SOMA.
  Não tem nome, cores nem ícone do SOMA, e não volta para o app.
  Mostra a previsão de São Paulo pela Open-Meteo (dados públicos, sem chave);
  a localização da pessoa não é pedida nem enviada.
-->
<style>
  :root {
    --fundo: #EEF3F9;
    --cartao: #FFFFFF;
    --texto: #1D2733;
    --suave: #5B6878;
    --linha: #DCE3EC;
    --azul: #2F6FB5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--fundo); }
  body {
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto);
    padding: env(safe-area-inset-top) 16px 24px;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    max-width: 560px; margin: 0 auto; padding: 16px 0 12px;
  }
  .busca {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--cartao); border: 1px solid var(--linha);
    border-radius: 24px; padding: 10px 16px; color: var(--suave);
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
  .cartao {
    background: var(--cartao); border: 1px solid var(--linha);
    border-radius: 16px; padding: 18px;
  }
  .lugar { color: var(--suave); font-size: 13px; }
  .agora { display: flex; align-items: center; gap: 14px; margin: 8px 0 4px; }
  .icone { font-size: 46px; line-height: 1; }
  .temp { font-size: 52px; font-weight: 300; letter-spacing: -1px; }
  .desc { font-size: 16px; }
  .detalhes { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--suave); font-size: 13px; margin-top: 10px; }
  .titulo { font-weight: 600; margin: 0 0 10px; font-size: 15px; }
  .dias { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; font-size: 13px; color: var(--suave); }
  .dias .ic { font-size: 22px; display: block; margin: 4px 0; }
  .dias b { color: var(--texto); font-weight: 600; }
  .rodape { color: var(--suave); font-size: 12px; text-align: center; margin-top: 6px; }
  .rodape a { color: var(--azul); }
</style>
</head>
<body>
<header>
  <div class="busca" role="search">🔍 previsão do tempo</div>
</header>
<main>
  <section class="cartao" aria-live="polite">
    <div class="lugar">São Paulo, SP · <span id="hora">agora</span></div>
    <div class="agora">
      <span class="icone" id="icone">⛅</span>
      <span class="temp" id="temp">--°</span>
    </div>
    <div class="desc" id="desc">Carregando previsão…</div>
    <div class="detalhes">
      <span id="sensacao"></span><span id="umidade"></span><span id="vento"></span>
    </div>
  </section>
  <section class="cartao">
    <p class="titulo">Próximos dias</p>
    <div class="dias" id="dias"></div>
  </section>
  <p class="rodape">Dados: <a href="https://open-meteo.com/" rel="noreferrer">Open-Meteo</a></p>
</main>
<script>
  // Códigos de tempo da OMM usados pela Open-Meteo
  function tempoDe(c) {
    if (c === 0) return ['☀️', 'Céu limpo'];
    if (c === 1) return ['🌤️', 'Predominantemente limpo'];
    if (c === 2) return ['⛅', 'Parcialmente nublado'];
    if (c === 3) return ['☁️', 'Nublado'];
    if (c === 45 || c === 48) return ['🌫️', 'Neblina'];
    if (c >= 51 && c <= 57) return ['🌦️', 'Garoa'];
    if (c >= 61 && c <= 67) return ['🌧️', 'Chuva'];
    if (c >= 80 && c <= 82) return ['🌦️', 'Pancadas de chuva'];
    if (c >= 95) return ['⛈️', 'Tempestade'];
    return ['🌥️', 'Tempo instável'];
  }
  var DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=-23.55&longitude=-46.63' +
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
    '&timezone=America%2FSao_Paulo&forecast_days=5';
  var $ = function (id) { return document.getElementById(id); };

  fetch(url)
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      var c = d.current, t = tempoDe(c.weather_code);
      $('icone').textContent = t[0];
      $('temp').textContent = Math.round(c.temperature_2m) + '°';
      $('desc').textContent = t[1];
      $('hora').textContent = 'atualizado às ' + c.time.slice(11, 16);
      $('sensacao').textContent = 'Sensação ' + Math.round(c.apparent_temperature) + '°';
      $('umidade').textContent = 'Umidade ' + Math.round(c.relative_humidity_2m) + '%';
      $('vento').textContent = 'Vento ' + Math.round(c.wind_speed_10m) + ' km/h';
      $('dias').innerHTML = d.daily.time.map(function (dia, i) {
        var td = tempoDe(d.daily.weather_code[i]);
        var nome = i === 0 ? 'hoje' : DIAS[new Date(dia + 'T12:00:00').getDay()];
        return '<div>' + nome + '<span class="ic">' + td[0] + '</span><b>' +
          Math.round(d.daily.temperature_2m_max[i]) + '°</b> ' +
          Math.round(d.daily.temperature_2m_min[i]) + '°</div>';
      }).join('');
    })
    .catch(function () {
      // Sem internet: a página continua neutra, sem números inventados.
      $('desc').textContent = 'Não foi possível atualizar a previsão agora.';
      $('icone').textContent = '🌥️';
    });
</script>
</body>
</html>
